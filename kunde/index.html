<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>MoltenLoop | PrintCalc</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#eeeae2;font:16px system-ui,sans-serif}main{max-width:480px;margin:auto;padding:20px 24px 40px}header{text-align:center}header img{width:100%;max-width:340px;display:block;margin:-25px auto -35px}small,.muted{color:#a6aaa5}h1{font-size:26px;letter-spacing:-1px;margin:12px 0 4px}form{margin-top:24px}label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}input[type=number]{width:100%;background:#101210;color:#eeeae2;border:1px solid #303a33;border-radius:8px;padding:14px;font:inherit;outline:none}input:focus{border-color:#729b80}input::placeholder{color:#737b75}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shipping{display:flex;align-items:center;gap:10px;padding:16px 0}input[type=checkbox]{accent-color:#52765d;width:20px;height:20px}.result{border:1px solid #385543;background:#0b100d;border-radius:12px;padding:22px;margin-top:12px}.price{font-size:44px;font-weight:650;letter-spacing:-2px;margin:6px 0}button{width:100%;background:transparent;color:#b9c9bd;border:1px solid #303a33;border-radius:8px;padding:13px;margin-top:16px;font:inherit;cursor:pointer}footer{text-align:center;font-size:11px;letter-spacing:2px;color:#758078;margin-top:30px}</style></head><body><main><header><img src="logo.jpg" alt="MoltenLoop – Deko & Accessoires"><h1>PrintCalc</h1><small>Dein 3D-Druck. Transparent kalkuliert.</small></header><form id="calc" autocomplete="off"><label for="weight">Materialgewicht (g)</label><input id="weight" type="number" min="0" step="any" placeholder="z. B. 120" inputmode="decimal"><label>Druckzeit</label><div class="pair"><input id="hours" aria-label="Druckstunden" type="number" min="0" step="1" placeholder="Stunden"><input id="minutes" aria-label="Druckminuten" type="number" min="0" max="59" step="1" placeholder="Minuten"></div><label for="work">Arbeitszeit (Minuten, optional)</label><input id="work" type="number" min="0" step="any" placeholder="Minuten"><label class="shipping"><input id="shipping" type="checkbox"> Versand hinzufügen (+6,99 €)</label><div class="result" aria-live="polite"><small>GESCHÄTZTER KUNDENPREIS</small><div class="price" id="price">—</div><small id="hint">Gewicht und Druckzeit eingeben.</small></div><button type="reset">Eingaben zurücksetzen</button></form><footer>MOLTENLOOP · PRINTCALC</footer></main><script>const f=document.querySelector('form'),g=id=>document.getElementById(id),n=id=>Number(g(id).value||0);function update(){const valid=f.checkValidity()&&g('weight').value!==''&&(g('hours').value!==''||g('minutes').value!=='');let p=valid?Math.ceil((Math.max(5,n('weight')*.05+(n('hours')+n('minutes')/60)*2+n('work')/60*20)+(g('shipping').checked?6.99:0))*2-1e-9)/2:null;g('price').textContent=p===null?'—':p.toLocaleString('de-DE',{style:'currency',currency:'EUR'});g('hint').textContent=p===null?'Gewicht und Druckzeit eingeben.':'Unverbindliche Preiskalkulation';}f.addEventListener('input',update);f.addEventListener('reset',()=>setTimeout(update,0));f.addEventListener('submit',e=>e.preventDefault());window.addEventListener('pageshow',()=>{f.reset();update()});</script></body></html>
